<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Dood Event – Official Scannable QR Code Cards</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    :root {
      --navy: #101827;
      --green: #8CC63F;
      --lime: #B7E44A;
      --cream: #FFF9EC;
      --charcoal: #252A32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--cream);
      color: var(--charcoal);
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 24px;
    }
    .header img {
      height: 60px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 2rem;
      color: var(--navy);
      font-weight: 900;
    }
    p {
      color: #64748b;
      margin-top: 6px;
      font-size: 0.95rem;
    }
    .actions-bar {
      margin: 18px 0 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .btn {
      background: var(--green);
      color: var(--navy);
      border: 0;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 #58871d;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #58871d;
    }
    .btn-secondary {
      background: #fff;
      border: 2px solid #cbd5e1;
      color: var(--navy);
      box-shadow: 0 4px 0 #cbd5e1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .qr-card {
      background: #fff;
      border: 2.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 16px rgba(16, 24, 39, 0.06);
      page-break-inside: avoid;
    }
    .qr-card-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .qr-card-letter {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--green);
      margin: 4px 0 10px;
      line-height: 1;
    }
    .qr-box {
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 14px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }
    .qr-box canvas, .qr-box img {
      width: 150px !important;
      height: 150px !important;
    }
    .slot-info {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 12px;
    }
    .test-link {
      font-size: 0.82rem;
      color: #0284c7;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 700;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .actions-bar { display: none; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
      .qr-card { box-shadow: none; border: 1.5px solid #000; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="assets/logo.png" alt="Mr. Dood Logo">
      <h1>MR. DOOD OFFICIAL QR CARDS</h1>
      <p>Print these 7 cards or display them on a screen to scan with players' mobile devices.</p>
    </div>

    <div class="actions-bar">
      <button class="btn" onclick="window.print()">🖨️ Print QR Sheet</button>
      <a href="index.html" class="btn btn-secondary">🎮 Open Game</a>
    </div>

    <div class="grid" id="qr-grid"></div>
  </div>

  <script src="assets/qrcode.min.js"></script>
  <script>
    const TARGET = [
      { num: 1, letter: 'M', name: 'Letter M (Slot 1)' },
      { num: 2, letter: 'R', name: 'Letter R (Slot 2)' },
      { num: 3, letter: '.', name: 'Dot [.] (Slot 3)' },
      { num: 4, letter: 'D', name: 'Letter D (Slot 4)' },
      { num: 5, letter: 'O', name: 'Letter O (Slot 5)' },
      { num: 6, letter: 'O', name: 'Letter O (Slot 6)' },
      { num: 7, letter: 'D', name: 'Letter D (Slot 7)' }
    ];

    const grid = document.getElementById('qr-grid');

    TARGET.forEach(item => {
      const card = document.createElement('div');
      card.className = 'qr-card';
      
      const payloadUrl = `${window.location.origin}${window.location.pathname.replace('qr-sheet.html', '')}?scan=${item.num}`;

      card.innerHTML = `
        <div class="qr-card-title">QR CODE ${item.num} OF 7</div>
        <div class="qr-card-letter">${item.letter}</div>
        <div class="slot-info">MR.DOOD • Slot #${item.num}</div>
        <div class="qr-box" id="qr-${item.num}"></div>
        <a class="test-link" href="${payloadUrl}" target="_blank">Test Link (?scan=${item.num})</a>
      `;
      grid.appendChild(card);

      // Render QR code
      new QRCode(document.getElementById(`qr-${item.num}`), {
        text: payloadUrl,
        width: 150,
        height: 150,
        colorDark: '#101827',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  </script>
</body>
</html>
