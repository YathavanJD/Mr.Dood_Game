<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mr. Dood – Letter 1 of 7 (M)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #182236, #101827);
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #8CC63F;
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .letter {
      font-size: 72px;
      font-weight: 900;
      color: #8CC63F;
      margin: 10px 0;
      text-shadow: 0 4px 10px rgba(140, 198, 63, 0.5);
    }
    .btn {
      display: inline-block;
      margin-top: 18px;
      background: #8CC63F;
      color: #101827;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 #58871d;
    }
  </style>
  <script>
    // Automatically redirect to main game with scan parameter
    try {
      window.location.replace('../?scan=1');
    } catch(e) {}
  </script>
</head>
<body>
  <div class="box">
    <div style="font-size: 14px; color: #B7E44A; font-weight: 800;">MR. DOOD LETTER HUNT</div>
    <div class="letter">M</div>
    <div style="font-size: 18px; font-weight: 700;">Letter 1 of 7 Unlocked!</div>
    <p style="font-size: 14px; color: #94a3b8; margin-top: 6px;">Opening your game dashboard...</p>
    <a href="../?scan=1" class="btn">CONTINUE TO GAME ➔</a>
  </div>
</body>
</html>
